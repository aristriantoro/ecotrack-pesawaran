<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Saya — EcoTrack Kab. Pesawaran</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <div id="simBannerContainer"></div>

  <div class="dashboard-wrapper">
    <aside class="sidebar"></aside>

    <div class="main-content">
      <header class="topbar"></header>

      <main class="content-body">
        <div class="d-flex align-items-center justify-content-between mb-4">
          <div>
            <h4 class="fw-bold text-dark mb-1">Profil Pengguna</h4>
            <p class="text-muted small mb-0">Kelola informasi data diri dan kontak akun masyarakat Anda.</p>
          </div>
        </div>

        <div class="row">
          <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4 bg-white p-4 p-md-5">
              <form id="profileForm" onsubmit="handleUpdateProfile(event)">
                <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                  <div class="bg-success text-white rounded-circle d-flex align-items-center justify-content-center fs-3 fw-bold" style="width: 64px; height: 64px;" id="profileAvatar">
                    SA
                  </div>
                  <div>
                    <h5 class="fw-bold mb-0" id="profileNameDisplay">Siti Aminah</h5>
                    <span class="badge badge-eco badge-menunggu" style="background:#DCFCE7; color:#15803D;">Akun Warga Terdaftar</span>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-semibold text-dark">Nama Lengkap</label>
                  <input type="text" class="form-control" id="profileName" required>
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold text-dark">Alamat Email (Simulasi)</label>
                    <input type="email" class="form-control bg-light" id="profileEmail" readonly>
                    <div class="form-text small">Email login tidak dapat diubah pada mode simulasi.</div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold text-dark">Nomor WhatsApp / HP</label>
                    <input type="tel" class="form-control" id="profilePhone" required>
                  </div>
                </div>

                <div class="mb-4">
                  <label class="form-label small fw-semibold text-dark">Alamat Domisili di Pesawaran</label>
                  <textarea class="form-control" id="profileAddress" rows="3"></textarea>
                </div>

                <div class="d-flex justify-content-end">
                  <button type="submit" class="btn btn-primary-eco px-4">
                    <i class="bi bi-save me-1"></i> Simpan Perubahan Profil
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/data-seed.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    const user = Auth.requireAuth(['citizen'], 1);
    if (user) {
      App.renderSimulationBanner();
      App.renderSidebar('citizen', 'profile');
      App.renderTopbar('Profil Saya', [{ label: 'EcoTrack', href: '../index.html' }, { label: 'Profil' }]);

      document.getElementById('profileName').value = user.name;
      document.getElementById('profileEmail').value = user.email;
      document.getElementById('profilePhone').value = user.phone || '';
      document.getElementById('profileAddress').value = user.address || '';
      document.getElementById('profileNameDisplay').textContent = user.name;
      document.getElementById('profileAvatar').textContent = user.name.split(' ').map(n=>n[0]).slice(0,2).join('');
    }

    function handleUpdateProfile(e) {
      e.preventDefault();
      user.name = document.getElementById('profileName').value.trim();
      user.phone = document.getElementById('profilePhone').value.trim();
      user.address = document.getElementById('profileAddress').value.trim();

      StorageManager.saveUser(user);
      Auth.setCurrentUser(user);
      App.toast('Profil berhasil diperbarui!', 'success');
      setTimeout(() => window.location.reload(), 600);
    }
  </script>
</body>
</html>
