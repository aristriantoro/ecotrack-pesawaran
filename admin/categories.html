<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kategori Sampah — EcoTrack Kab. Pesawaran</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <div id="simBannerContainer"></div>

  <div class="dashboard-wrapper">
    <aside class="sidebar"></aside>

    <div class="main-content">
      <header class="topbar"></header>

      <main class="content-body">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-4">
          <div>
            <h4 class="fw-bold text-dark mb-1">Master Kategori Permasalahan Sampah</h4>
            <p class="text-muted small mb-0">Klasifikasi jenis sampah untuk memudahkan pemilihan armada pengangkutan dan penanganan di DLH Kab. Pesawaran.</p>
          </div>
          <button type="button" class="btn btn-primary-eco btn-sm" onclick="openAddCategoryModal()">
            <i class="bi bi-plus-lg me-1"></i> Tambah Kategori Baru
          </button>
        </div>

        <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr class="small text-muted text-uppercase">
                  <th class="ps-4" style="width: 80px;">ID</th>
                  <th>Nama Kategori</th>
                  <th>Deskripsi Kategori</th>
                  <th>Laporan Terkait</th>
                  <th class="text-end pe-4" style="width: 140px;">Aksi</th>
                </tr>
              </thead>
              <tbody id="categoriesTableBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal Category -->
  <div class="modal fade" id="categoryModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold text-dark" id="categoryModalTitle">Tambah Kategori Sampah</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="categoryForm" onsubmit="handleSaveCategory(event)">
            <input type="hidden" id="editCategoryId">
            <div class="mb-3">
              <label class="form-label small fw-semibold text-dark">Nama Kategori <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="catNameInput" required placeholder="Contoh: Sampah Elektronik (E-Waste)">
            </div>
            <div class="mb-4">
              <label class="form-label small fw-semibold text-dark">Deskripsi & Ruang Lingkup</label>
              <textarea class="form-control" id="catDescInput" rows="3" placeholder="Jelaskan jenis sampah yang termasuk kategori ini..."></textarea>
            </div>
            <div class="d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
              <button type="submit" class="btn btn-primary-eco">Simpan Kategori</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/data-seed.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    const user = Auth.requireAuth(['admin'], 1);

    if (user) {
      App.renderSimulationBanner();
      App.renderSidebar('admin', 'categories');
      App.renderTopbar('Kategori Sampah', [
        { label: 'EcoTrack', href: '../index.html' },
        { label: 'Admin', href: 'dashboard.html' },
        { label: 'Kategori' }
      ]);

      renderCategoriesTable();
    }

    function renderCategoriesTable() {
      const categories = StorageManager.getCategories();
      const reports = StorageManager.getReports();
      const tbody = document.getElementById('categoriesTableBody');

      tbody.innerHTML = categories.map(c => {
        const count = reports.filter(r => r.category_id === c.id || r.category_name === c.name).length;
        return `
          <tr>
            <td class="ps-4 fw-bold text-muted">${c.id}</td>
            <td>
              <span class="fw-bold text-dark fs-6">${App.escapeHtml(c.name)}</span>
            </td>
            <td class="small text-muted" style="max-width: 400px;">${App.escapeHtml(c.description || '-')}</td>
            <td>
              <span class="badge bg-success-subtle text-success fs-6">${count} Laporan</span>
            </td>
            <td class="text-end pe-4">
              <button class="btn btn-sm btn-outline-secondary me-1" onclick="openEditCategory(${c.id})" title="Edit"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm btn-outline-danger" onclick="deleteCategoryPrompt(${c.id})" title="Hapus"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function openAddCategoryModal() {
      document.getElementById('editCategoryId').value = '';
      document.getElementById('categoryModalTitle').textContent = 'Tambah Kategori Sampah Baru';
      document.getElementById('catNameInput').value = '';
      document.getElementById('catDescInput').value = '';
      new bootstrap.Modal(document.getElementById('categoryModal')).show();
    }

    function openEditCategory(id) {
      const cats = StorageManager.getCategories();
      const c = cats.find(item => item.id === Number(id));
      if (!c) return;

      document.getElementById('editCategoryId').value = c.id;
      document.getElementById('categoryModalTitle').textContent = 'Edit Kategori Sampah';
      document.getElementById('catNameInput').value = c.name;
      document.getElementById('catDescInput').value = c.description || '';
      new bootstrap.Modal(document.getElementById('categoryModal')).show();
    }

    function handleSaveCategory(e) {
      e.preventDefault();
      const editId = document.getElementById('editCategoryId').value;
      const name = document.getElementById('catNameInput').value.trim();
      const description = document.getElementById('catDescInput').value.trim();

      StorageManager.saveCategory({
        id: editId ? Number(editId) : undefined,
        name,
        description
      });

      bootstrap.Modal.getInstance(document.getElementById('categoryModal')).hide();
      App.toast('Kategori berhasil disimpan.', 'success');
      renderCategoriesTable();
    }

    function deleteCategoryPrompt(id) {
      const cats = StorageManager.getCategories();
      const c = cats.find(item => item.id === Number(id));
      if (!c) return;

      App.confirmModal({
        title: 'Hapus Kategori Sampah?',
        message: `Apakah Anda yakin ingin menghapus kategori <strong>${c.name}</strong>?`,
        confirmText: 'Ya, Hapus',
        confirmBtnClass: 'btn-danger',
        onConfirm: () => {
          StorageManager.deleteCategory(id);
          App.toast(`Kategori ${c.name} telah dihapus.`, 'warning');
          renderCategoriesTable();
        }
      });
    }
  </script>
</body>
</html>
