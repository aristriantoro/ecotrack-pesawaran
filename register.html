<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun Warga — EcoTrack Kab. Pesawaran</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts Inter -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">

  <div id="simBannerContainer"></div>

  <div class="min-vh-100 d-flex flex-column justify-content-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-9 col-lg-7 col-xl-6">
          
          <div class="text-center mb-4">
            <a href="index.html" class="d-inline-flex align-items-center gap-2 fw-bold text-success fs-3 text-decoration-none">
              <div class="bg-success text-white rounded-3 p-2 d-flex align-items-center justify-content-center shadow-sm" style="width: 44px; height: 44px;">
                <i class="bi bi-recycle fs-4"></i>
              </div>
              <span>Eco<span style="color: var(--secondary-teal);">Track</span></span>
            </a>
            <p class="text-muted small mt-1">Pendaftaran Akun Masyarakat Kabupaten Pesawaran</p>
          </div>

          <div class="card border-0 shadow-md rounded-4 overflow-hidden bg-white">
            <div class="card-body p-4 p-sm-5">
              <h4 class="fw-bold text-dark mb-1">Daftar Akun Baru</h4>
              <p class="text-muted small mb-4">Lengkapi data diri untuk berpartisipasi aktif menjaga kebersihan lingkungan Pesawaran.</p>

              <div id="regAlertBox" class="alert alert-danger d-none py-2 px-3 small rounded-3 mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span id="regAlertText">Terjadi kesalahan.</span>
              </div>

              <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="mb-3">
                  <label class="form-label small fw-semibold text-dark">Nama Lengkap <span class="text-danger">*</span></label>
                  <input type="text" class="form-control bg-light" id="regName" placeholder="Contoh: Ahmad Fauzi" required>
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-sm-6">
                    <label class="form-label small fw-semibold text-dark">Alamat Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control bg-light" id="regEmail" placeholder="nama@email.com" required>
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label small fw-semibold text-dark">Nomor WhatsApp / HP <span class="text-danger">*</span></label>
                    <input type="tel" class="form-control bg-light" id="regPhone" placeholder="08xxxxxxxxxx" required>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-semibold text-dark">Alamat Domisili di Pesawaran</label>
                  <textarea class="form-control bg-light" id="regAddress" rows="2" placeholder="Contoh: Dusun Sukamaju RT 02, Desa Bagelen, Gedong Tataan"></textarea>
                </div>

                <div class="row g-3 mb-4">
                  <div class="col-sm-6">
                    <label class="form-label small fw-semibold text-dark">Password <span class="text-danger">*</span></label>
                    <input type="password" class="form-control bg-light" id="regPassword" placeholder="Minimal 6 karakter" required minlength="6">
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label small fw-semibold text-dark">Konfirmasi Password <span class="text-danger">*</span></label>
                    <input type="password" class="form-control bg-light" id="regConfirmPassword" placeholder="Ulangi password" required minlength="6">
                  </div>
                </div>

                <div class="form-check mb-4">
                  <input class="form-check-input" type="checkbox" id="termsAgree" required>
                  <label class="form-check-label small text-muted" for="termsAgree">
                    Saya menyetujui ketentuan simulasi pelaporan sampah EcoTrack Kab. Pesawaran.
                  </label>
                </div>

                <button type="submit" class="btn btn-primary-eco w-100 py-2 fw-semibold shadow-sm mb-3">
                  Daftar Sekarang & Masuk
                </button>
              </form>

              <div class="text-center pt-3 border-top">
                <p class="small text-muted mb-0">
                  Sudah memiliki akun? 
                  <a href="login.html" class="fw-semibold text-success text-decoration-none">Masuk di sini</a>
                </p>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data-seed.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>

  <script>
    App.renderSimulationBanner();

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const address = document.getElementById('regAddress').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;
      const alertBox = document.getElementById('regAlertBox');
      const alertText = document.getElementById('regAlertText');

      alertBox.classList.add('d-none');

      if (password !== confirmPassword) {
        alertText.textContent = "Password dan Konfirmasi Password tidak cocok!";
        alertBox.classList.remove('d-none');
        return;
      }

      try {
        const newUser = Auth.register({ name, email, phone, address, password });
        App.toast(`Akun berhasil dibuat! Selamat datang, ${newUser.name}.`, 'success');
        setTimeout(() => {
          window.location.href = 'masyarakat/dashboard.html';
        }, 600);
      } catch (err) {
        alertText.textContent = err.message;
        alertBox.classList.remove('d-none');
      }
    }
  </script>
</body>
</html>
